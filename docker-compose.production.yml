version: '3.9'

# ==============================================================================
# PRODUCTION DOCKER COMPOSE - UNIFIED PENTEST PLATFORM
# ==============================================================================

services:
  # ============================================================================
  # API GATEWAY - Main entry point
  # ============================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: apps/api-gateway/Dockerfile
      target: production
    image: airiskmgr/api-gateway:${VERSION:-latest}
    container_name: api-gateway
    restart: always
    ports:
      - "3003:3001"
    networks:
      - frontend-network
      - backend-network
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3004}
      - THROTTLE_TTL=60000
      - THROTTLE_LIMIT=100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # PROMPTFOO SERVICE
  # ============================================================================
  promptfoo-service:
    build:
      context: ./guardrail/solution_promptfoo
      dockerfile: Dockerfile.service
    image: airiskmgr/promptfoo-service:${PROMPTFOO_VERSION:-latest}
    container_name: promptfoo-service-${COLOR:-blue}
    restart: always
    networks:
      - tools-network
    environment:
      - NODE_ENV=production
      - SERVICE_PORT=3000
      - SERVICE_NAME=promptfoo
    volumes:
      - promptfoo-results:/app/results:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "service=promptfoo-service"
      - "env=production"
      - "color=${COLOR:-blue}"
      - "tool=promptfoo"

  # ============================================================================
  # GARAK SERVICE
  # ============================================================================
  garak-service:
    build:
      context: ./guardrail/solution_garak
      dockerfile: Dockerfile.service
    image: airiskmgr/garak-service:${GARAK_VERSION:-latest}
    container_name: garak-service-${COLOR:-blue}
    restart: always
    networks:
      - tools-network
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_PORT=3000
      - SERVICE_NAME=garak
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - garak-results:/app/results:ro
      - garak-cache:/root/.cache/garak:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "service=garak-service"
      - "env=production"
      - "color=${COLOR:-blue}"
      - "tool=garak"

  # ============================================================================
  # ORCHESTRATOR SERVICE
  # ============================================================================
  orchestrator:
    build:
      context: ./backend
      dockerfile: apps/orchestrator/Dockerfile
      target: production
    image: airiskmgr/orchestrator:${VERSION:-latest}
    container_name: orchestrator
    restart: always
    networks:
      - backend-network
      - tools-network
      - database-network
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================================================
  # GITHUB SYNC SERVICE
  # ============================================================================
  github-sync:
    build:
      context: ./backend
      dockerfile: apps/github-sync-service/Dockerfile
      target: production
    image: airiskmgr/github-sync:${VERSION:-latest}
    container_name: github-sync
    restart: always
    networks:
      - frontend-network
      - backend-network
    ports:
      - "3005:3000"  # Webhook endpoint
    environment:
      - NODE_ENV=production
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - DOCKER_REGISTRY=${DOCKER_REGISTRY:-registry.gitlab.com}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - github-repos:/tmp/repos:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================================================
  # POSTGRESQL DATABASE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    networks:
      - database-network
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=airiskmgr_db
      - POSTGRES_USER=airiskmgr
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airiskmgr -d airiskmgr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # ============================================================================
  # REDIS CACHE & QUEUE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - database-network
    ports:
      - "6380:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================================================
  # MINIO (Object Storage for reports, artifacts)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    networks:
      - database-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================================================
  # PROMETHEUS (Metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    networks:
      - backend-network
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================================================
  # GRAFANA (Dashboards)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    networks:
      - backend-network
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3002
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # ELASTICSEARCH (Logs)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    networks:
      - backend-network
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # KIBANA (Log visualization)
  # ============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: always
    networks:
      - backend-network
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  frontend-network:
    driver: bridge
    internal: false  # Internet access for webhooks

  backend-network:
    driver: bridge
    internal: true   # No direct internet access

  tools-network:
    driver: bridge
    internal: true   # Isolated for security tools

  database-network:
    driver: bridge
    internal: true   # No external access

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres-data:
    driver: local
  postgres-backups:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
  promptfoo-results:
    driver: local
  garak-results:
    driver: local
  garak-cache:
    driver: local
  github-repos:
    driver: local
