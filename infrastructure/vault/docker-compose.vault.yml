version: '3.9'

# ==============================================================================
# HASHICORP VAULT - SECRETS MANAGEMENT
# ==============================================================================
# This file can be merged with docker-compose.production.yml
# Usage: docker-compose -f docker-compose.production.yml -f infrastructure/vault/docker-compose.vault.yml up -d

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    restart: always
    ports:
      - "8200:8200"
    networks:
      - backend-network
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-root}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./vault-config.hcl:/vault/config/vault.hcl:ro
    cap_add:
      - IPC_LOCK
    command: server
    healthcheck:
      test: ["CMD", "wget", "--spider", "--proxy", "off", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "service=vault"
      - "env=production"

  # Vault UI (optional - for development/staging only)
  vault-ui:
    image: djenriquez/vault-ui:latest
    container_name: vault-ui
    restart: always
    ports:
      - "8000:8000"
    networks:
      - backend-network
    environment:
      - VAULT_URL_DEFAULT=http://vault:8200
      - VAULT_AUTH_DEFAULT=TOKEN
    depends_on:
      - vault
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      - "service=vault-ui"
      - "env=production"
    profiles:
      - development  # Only start in development profile

networks:
  backend-network:
    external: true

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local
