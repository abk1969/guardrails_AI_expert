groups:
  - name: unified_pentest_alerts
    interval: 30s
    rules:
      # ========================================================================
      # CRITICAL ALERTS
      # ========================================================================

      # Service Down
      - alert: ServiceDown
        expr: up{job=~"promptfoo-service|garak-service|api-gateway|orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for 2 minutes"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(test_runs_total{status="failure"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High test failure rate detected on {{ $labels.tool }}"
          description: "{{ $labels.tool }} has error rate > 10% for 5 minutes"

      # Deployment Failed
      - alert: DeploymentFailed
        expr: deployments_total{status="failure"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Deployment failed for {{ $labels.tool }}"
          description: "{{ $labels.tool }} deployment failed. Check logs immediately."

      # Critical Vulnerabilities Found
      - alert: CriticalVulnerabilitiesFound
        expr: increase(vulnerabilities_found_total{severity="critical"}[5m]) > 0
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Critical vulnerabilities detected by {{ $labels.tool }}"
          description: "{{ $labels.tool }} found {{ $value }} critical vulnerabilities in the last 5 minutes"

      # Database Connection Failed
      - alert: DatabaseConnectionFailed
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down"
          description: "Cannot connect to PostgreSQL database"

      # Redis Connection Failed
      - alert: RedisConnectionFailed
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis cache/queue is down"
          description: "Cannot connect to Redis"

      # ========================================================================
      # HIGH ALERTS
      # ========================================================================

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High memory usage on {{ $labels.container_name }}"
          description: "{{ $labels.container_name }} is using > 90% memory for 5 minutes"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High CPU usage on {{ $labels.container_name }}"
          description: "{{ $labels.container_name }} is using > 80% CPU for 5 minutes"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Disk space low on {{ $labels.device }}"
          description: "{{ $labels.device }} has less than 15% available space"

      # ========================================================================
      # WARNING ALERTS
      # ========================================================================

      # Slow Test Execution
      - alert: SlowTests
        expr: histogram_quantile(0.95, rate(test_duration_seconds_bucket[10m])) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tests are running slowly on {{ $labels.tool }}"
          description: "{{ $labels.tool }} p95 test duration > 5 minutes"

      # High API Response Time
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(api_response_time_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API response time on {{ $labels.route }}"
          description: "{{ $labels.route }} p95 response time > 1 second"

      # High Active Tests
      - alert: HighActiveTests
        expr: active_tests > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High number of active tests on {{ $labels.tool }}"
          description: "{{ $labels.tool }} has > 10 concurrent tests running for 10 minutes"

      # PostgreSQL Connections High
      - alert: PostgreSQLConnectionsHigh
        expr: sum(pg_stat_activity_count) > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high"
          description: "PostgreSQL has > 150 active connections"

      # Redis Memory Usage High
      - alert: RedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using > 80% of allocated memory"

      # ========================================================================
      # INFO ALERTS
      # ========================================================================

      # New Version Deployed
      - alert: NewVersionDeployed
        expr: changes(tool_versions[5m]) > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "New version deployed for {{ $labels.tool }}"
          description: "{{ $labels.tool }} has been updated to version {{ $labels.version }}"
