version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: airiskmgr-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"  # Port externe modifié pour éviter conflit
    environment:
      POSTGRES_USER: airiskmgr
      POSTGRES_PASSWORD: airiskmgr_dev_password
      POSTGRES_DB: airiskmgr_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airiskmgr -d airiskmgr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airiskmgr-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: airiskmgr-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Port externe modifié pour éviter conflit
    command: redis-server --appendonly yes --requirepass redis_dev_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airiskmgr-network

  # Backend API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: apps/api-gateway/Dockerfile
      target: development
    container_name: airiskmgr-api-gateway
    restart: unless-stopped
    ports:
      - "3003:3001"  # Port externe modifié pour éviter conflit
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://airiskmgr:airiskmgr_dev_password@postgres:5432/airiskmgr_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_dev_password
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      ENCRYPTION_KEY: dev-32-char-encryption-key-here
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: http://localhost:3004  # Nouveau port frontend
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    volumes:
      - ./backend/apps:/app/apps
      - ./backend/libs:/app/libs
      - ./backend/prisma:/app/prisma
      - ./guardrail:/app/guardrail  # Mount guardrail directory for Promptfoo tests
      - /app/node_modules  # Use container's node_modules (Debian-compiled)
      # Removed /app/dist volume to allow hot-reload to work properly
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airiskmgr-network
    command: npm run start:dev

  # Test Execution Service
  test-execution-service:
    build:
      context: ./backend
      dockerfile: apps/test-execution-service/Dockerfile
      target: development
    container_name: airiskmgr-test-execution
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://airiskmgr:airiskmgr_dev_password@postgres:5432/airiskmgr_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_dev_password
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airiskmgr-network
    command: npm run start:dev test-execution-service

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: airiskmgr-frontend
    restart: unless-stopped
    ports:
      - "3004:3000"  # Port externe modifié pour éviter conflit
    environment:
      VITE_PORT: 3000  # Configure Vite to use port 3000 in Docker
      VITE_HMR_PORT: 3004  # HMR WebSocket uses external port
      VITE_API_URL: http://localhost:3003/api/v1  # Pointe vers le nouveau port API avec /api/v1
      VITE_WS_URL: ws://localhost:3003  # Pointe vers le nouveau port API
      VITE_MCP_API_URL: http://localhost:3003/api/v1/mcp  # Pointe vers le nouveau port API
      VITE_MCP_MOCK_MODE: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - airiskmgr-network
    command: npm run dev

  # Database Admin UI (Adminer)
  adminer:
    image: adminer:latest
    container_name: airiskmgr-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"  # Port externe modifié pour éviter conflit
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
    networks:
      - airiskmgr-network

  # Redis Commander (Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: airiskmgr-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_dev_password
    depends_on:
      - redis
    networks:
      - airiskmgr-network

  # Mailhog (Email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: airiskmgr-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - airiskmgr-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: airiskmgr-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - airiskmgr-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: airiskmgr-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - airiskmgr-network

  # ========================================
  # PENTEST TOOLS ISOLATION
  # ========================================
  # These services run security testing tools in complete isolation
  # - No external ports exposed
  # - Separate network for isolation
  # - CPU/RAM limits to prevent DoS
  # - Non-root users inside containers
  # - Dedicated volumes for outputs
  # ========================================

  # Garak LLM Vulnerability Scanner (isolated)
  garak-runner:
    build:
      context: ./backend/docker/garak
      dockerfile: Dockerfile
    container_name: airiskmgr-garak-runner
    restart: unless-stopped
    volumes:
      - garak_output:/app/output
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      PYTHONUNBUFFERED: 1
      GARAK_OUTPUT_DIR: /app/output
    networks:
      - pentest-isolated-network
      - airiskmgr-network  # Allow communication with API Gateway
    healthcheck:
      test: ["CMD", "garak", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Strix Agentic AI Testing Framework (isolated)
  strix-runner:
    build:
      context: ./backend/docker/strix
      dockerfile: Dockerfile
    container_name: airiskmgr-strix-runner
    restart: unless-stopped
    volumes:
      - strix_output:/app/output
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      PYTHONUNBUFFERED: 1
      STRIX_OUTPUT_DIR: /app/output
      CHROME_BIN: /usr/bin/chromium
      CHROMIUM_FLAGS: "--no-sandbox --disable-dev-shm-usage"
    networks:
      - pentest-isolated-network
      - airiskmgr-network  # Allow communication with API Gateway
    healthcheck:
      test: ["CMD", "strix", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Promptfoo LLM Testing Framework (isolated)
  promptfoo-runner:
    build:
      context: ./backend/docker/promptfoo
      dockerfile: Dockerfile
    container_name: airiskmgr-promptfoo-runner
    restart: unless-stopped
    volumes:
      - promptfoo_output:/app/output
      - promptfoo_configs:/app/configs
      - ./guardrail/solution_promptfoo:/app/promptfoo-repo:ro  # Read-only mount of configs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      NODE_ENV: production
      PROMPTFOO_OUTPUT_DIR: /app/output
      PROMPTFOO_CONFIG_DIR: /app/configs
    networks:
      - pentest-isolated-network
      - airiskmgr-network  # Allow communication with API Gateway
    healthcheck:
      test: ["CMD", "promptfoo", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # Pentest tools isolated volumes
  garak_output:
    driver: local
  strix_output:
    driver: local
  promptfoo_output:
    driver: local
  promptfoo_configs:
    driver: local

networks:
  airiskmgr-network:
    driver: bridge
  # Isolated network for pentest tools
  # Tools can communicate with each other and API Gateway, but not external services
  pentest-isolated-network:
    driver: bridge
    internal: false  # Allow external communication for testing targets
